name: Deploy Velo Admin

# Builds and deploys the admin dashboard to the VPS on every push to main.
# The source is checked out in Actions and COPIED to the server (the VPS has
# no GitHub credentials - deploy keys are disabled for this repo, which is why
# the old git-pull-on-VPS flow failed with "Repository not found"). Then: SSH
# in, rebuild the image (with the real API key baked in), recreate the
# container, and health-check it.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy source to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST || '162.35.106.11' }}
          username: ${{ secrets.SERVER_USER || 'devkojo' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "."
          target: "~/apps/velo-admin/src"
          rm: true

      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          # Optional: set this repo secret to the backend's API_KEY. If unset, the
          # script reads it straight from the running backend pod on the VPS.
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST || '162.35.106.11' }}
          username: ${{ secrets.SERVER_USER || 'devkojo' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 900s
          envs: VITE_API_KEY
          script: |
            set -e
            echo "=========================================="
            echo "ADMIN DEPLOYMENT STARTED  $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "=========================================="

            cd ~/apps/velo-admin/src

            echo "-- RESOLVING API KEY --"
            KEY="$VITE_API_KEY"
            if [ -z "$KEY" ]; then
              echo "VITE_API_KEY secret not set; reading API_KEY from the backend pod"
              KEY=$(sudo kubectl exec -n velo deploy/velo-api -- printenv API_KEY 2>/dev/null || true)
            fi
            if [ -z "$KEY" ]; then
              echo "ERROR: could not resolve an API key (set the VITE_API_KEY repo secret)"; exit 1
            fi
            echo "Using an API key of length ${#KEY} (value not printed)."

            echo "-- BUILDING IMAGE --"
            docker build --build-arg VITE_API_KEY="$KEY" -t velo-frontend:latest .

            echo "-- RECREATING CONTAINER --"
            docker rm -f velo-frontend || true
            docker run -d -p 8080:80 --name velo-frontend --restart=always velo-frontend:latest

            echo "-- HEALTH CHECK --"
            sleep 4
            if [ -n "$(docker ps --filter name=velo-frontend --filter status=running -q)" ]; then
              echo "OK: velo-frontend is running on :8080"
            else
              echo "ERROR: container not running - recent logs:"; docker logs velo-frontend --tail=40 || true; exit 1
            fi

            echo "-- PRUNING OLD IMAGES --"
            docker image prune -f >/dev/null 2>&1 || true

            echo "=========================================="
            echo "ADMIN DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "## Admin Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Admin Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Author | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
